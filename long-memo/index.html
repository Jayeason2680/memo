<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101011"><title>Memo Studio · Long recordings</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#101011;color:#f4f1ed}
    *{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
    .shell{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 20px calc(42px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 24px;border-bottom:1px solid #28282a}
    .brand{display:flex;align-items:center;gap:12px;font-weight:760;font-size:20px;letter-spacing:-.5px}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#d97757;color:#17100d;font-size:19px}
    .beta{font-size:11px;letter-spacing:1.3px;color:#e6a58e;border:1px solid #744533;padding:5px 8px;border-radius:20px}
    h1{font-size:clamp(30px,7vw,48px);line-height:1.06;letter-spacing:-1.6px;margin:34px 0 10px}h2{font-size:20px;margin:0 0 18px;letter-spacing:-.4px}h3{font-size:14px;margin:0 0 10px}p{line-height:1.5}.lead{color:#aaa9ad;margin:0 0 27px;max-width:590px}
    .card{background:#1b1b1d;border:1px solid #303033;border-radius:20px;padding:22px;margin:18px 0}.muted{color:#aaa9ad}.small{font-size:13px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.stack{display:grid;gap:15px}
    label{display:block;font-size:13px;font-weight:650;color:#d4d2d0;margin-bottom:8px}input[type=text],input[type=password],textarea,select{width:100%;border:1px solid #414145;border-radius:11px;background:#111112;color:#f4f1ed;padding:13px 14px;outline:none}input:focus,textarea:focus,select:focus{border-color:#d97757}textarea{min-height:70px;resize:vertical}
    .drop{display:block;text-align:center;padding:28px 17px;border:1.5px dashed #676064;border-radius:16px;background:#232020;cursor:pointer}.drop strong{display:block;margin:10px 0 3px}.drop input{position:absolute;opacity:0;width:1px;height:1px}.drop:focus-within{outline:2px solid #d97757}
    .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice label{margin:0;border:1px solid #414145;border-radius:13px;padding:13px;font-weight:500;cursor:pointer}.choice label:has(input:checked){border-color:#d97757;background:#33221c}.choice input{accent-color:#d97757;margin-right:5px}.choice span{display:block;color:#99999e;font-size:12px;line-height:1.35;margin:6px 0 0 21px}
    .primary,.secondary,.linkbutton{border:0;border-radius:12px;padding:13px 18px;font-weight:700}.primary{background:#d97757;color:#170e0b}.secondary{background:#303034;color:#f4f1ed}.linkbutton{background:none;color:#e6a58e;padding:6px 0}.full{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions a{display:inline-block;text-decoration:none;color:#f4f1ed;background:#303034;border-radius:10px;padding:11px 12px;font-weight:650;font-size:13px}
    .job{border-top:1px solid #343438;padding:17px 0}.job:first-child{border-top:0;padding-top:0}.job-title{font-weight:720;word-break:break-word}.pill{font-size:11px;border-radius:30px;padding:5px 9px;color:#d3c0a0;background:#3b3224;white-space:nowrap}.pill.ready{color:#a4e4bc;background:#1e3d2b}.pill.failed{color:#f6aba6;background:#4a2727}.progress{height:6px;background:#36363a;border-radius:8px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#d97757}
    .notice{background:#342922;border:1px solid #67442e;color:#f4c9ad;padding:12px 14px;border-radius:11px;margin:14px 0;line-height:1.45}.danger{background:#442729;border-color:#803d42;color:#ffd0cd}
    .report{white-space:pre-wrap;line-height:1.6;color:#d8d5d1;max-height:420px;overflow:auto;background:#151516;border:1px solid #2f2f32;border-radius:11px;padding:15px;font-size:14px}.speaker{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin:9px 0}.speaker span{font-size:12px;color:#aaa9ad;word-break:break-word}.speaker input{padding:10px}
    details{margin-top:16px}summary{cursor:pointer;color:#e6a58e;font-weight:650}footer{color:#77777c;font-size:12px;line-height:1.5;margin-top:34px}a{color:#e6a58e}
    @media(max-width:520px){.shell{padding-left:16px;padding-right:16px}.card{padding:18px}.choice{grid-template-columns:1fr}.speaker{grid-template-columns:1fr;gap:3px}}
  </style>
</head>
<body><div class="shell">
  <header><div class="brand"><span class="brand-mark">◉</span> Memo Studio</div><span class="beta">LONG MEMO BETA</span></header>
  <main id="app"></main>
  <footer>Private beta · Recordings and reports stay on protected service storage. Host backups may retain deleted files temporarily. Processing continues after you leave Safari. Check speaker identity and important figures against the audio.</footer>
</div>
<script>
const root=document.getElementById('app');let csrf='',jobs=[],selected=null,busy=false,timer=null;
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,options={}){const headers={...(options.headers||{})};if(options.body&&! (options.body instanceof Blob))headers['Content-Type']='application/json';if(options.method&&options.method!=='GET')headers['X-Memo-CSRF']=csrf;const response=await fetch('/api'+path,{credentials:'same-origin',...options,headers});if(!response.ok){let detail='Request failed ('+response.status+')';try{detail=(await response.json()).detail||detail}catch{}throw Error(detail)}return response.json()}
function error(message){const box=document.getElementById('message');if(box){box.hidden=false;box.className='notice danger';box.textContent=message}else alert(message)}
function stage(job){if(job.status==='uploading')return 'Upload '+Math.round(100*(job.offset||0)/job.size)+'%';if(job.status==='transcribing')return 'Transcribing part '+(job.current_part||1)+' of '+(job.total_parts||'?');return ({queued:'Queued',preparing:'Preparing audio',writing:'Writing reports',ready:'Ready',failed:'Needs attention'})[job.status]||job.status}
function jobCard(job){const progress=job.status==='uploading'?100*(job.offset||0)/job.size:(job.total_parts?100*(job.current_part||0)/job.total_parts:0);return `<div class="job"><div class="row"><span class="job-title">${escapeHtml(job.title)}</span><span class="pill ${job.status}">${escapeHtml(stage(job))}</span></div><div class="small muted" style="margin-top:5px">${escapeHtml(job.filename)} · ${new Date(job.created*1000).toLocaleString()}</div>${['uploading','transcribing','preparing','writing'].includes(job.status)?`<div class="progress"><i style="width:${Math.max(2,Math.min(100,progress))}%"></i></div>`:''}${job.error?`<div class="notice danger">${escapeHtml(job.error)}</div>`:''}<div class="actions" style="margin-top:11px">${job.status==='uploading'?`<button class="secondary" onclick="resume('${job.id}')">Resume upload</button>`:''}${job.status==='failed'?`<button class="secondary" onclick="retry('${job.id}')">Retry processing</button>`:''}${job.status==='ready'?`<button class="secondary" onclick="openJob('${job.id}')">View & download</button>`:''}</div></div>`}
function signedOut(){clearInterval(timer);root.innerHTML=`<h1>Long recordings,<br>one clear memo.</h1><p class="lead">Import an Apple Voice Memo from Files or iCloud, even when it is too large for the normal Memo page.</p><section class="card"><h2>Unlock your private studio</h2><div id="message" hidden></div><label for="password">Studio password</label><input id="password" type="password" autocomplete="current-password"><button class="primary full" style="margin-top:15px" onclick="signIn()">Continue</button></section><p class="small muted">This beta runs on a separate protected service. The current <a href="https://jayeason2680.github.io/memo/">Memo app</a> stays as it is.</p>`}
async function signIn(){try{const answer=await api('/login',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});csrf=answer.csrf;await refresh();timer=setInterval(refresh,5000)}catch(e){error(e.message)}}
async function restore(){try{csrf=(await api('/session')).csrf;await refresh();timer=setInterval(refresh,5000)}catch{signedOut()}}
async function refresh(){try{jobs=await api('/jobs');if(!document.getElementById('job-detail')){if(document.getElementById('jobs-list'))renderJobs();else renderHome()}else{const current=document.getElementById('job-detail').dataset.id;const detail=document.getElementById('job-detail');const job=jobs.find(j=>j.id===current);if(job&&(job.status!==detail.dataset.status||String(job.current_part||0)!==detail.dataset.part))await openJob(current)}}catch(e){if(e.message.includes('Sign in'))signedOut()}}
function renderJobs(){document.getElementById('jobs-count').textContent=jobs.length;document.getElementById('jobs-list').innerHTML=jobs.length?jobs.map(jobCard).join(''):'<p class="muted">Your completed memos will appear here.</p>'}
function renderHome(){root.innerHTML=`<h1>Your voice, the full picture.</h1><p class="lead">One iPhone upload. A complete transcript, a focused bilingual report, and a short bilingual summary. You can close Safari after upload and return later.</p><div id="message" hidden></div><section class="card"><h2>New recording</h2><div class="stack"><label class="drop">＋<strong id="file-label">Choose audio from Files or iCloud</strong><span class="small muted">Apple Voice Memos: share to Files first · M4A, MP3, MP4, WAV, WebM · up to 1 GB</span><input id="file" type="file" accept=".m4a,.mp3,.mp4,.mpeg,.mpga,.wav,.webm,audio/*" onchange="picked(this)"></label><div><label for="title">Title</label><input id="title" type="text" maxlength="120" placeholder="Client discussion, journal, meeting…"></div><div><label>Recording type</label><div class="choice"><label><input type="radio" name="mode" value="personal" checked> Personal voice note<span>Best for your own thoughts, multilingual speech, no speaker switches.</span></label><label><input type="radio" name="mode" value="meeting"> Conversation or meeting<span>Speaker labels and timestamps. Review identities across long recordings.</span></label></div></div><div><label for="terms">Names and specialist terms (optional)</label><textarea id="terms" maxlength="500" placeholder="Names, companies, trading symbols, banking terms…"></textarea></div><details><summary>Optional: identify up to four speakers</summary><p class="small muted">Add a clear 2–10 second clip of each speaker, with their name. This helps match speakers across long recordings. Use this only for Conversation or meeting.</p><div id="references"></div><button type="button" class="secondary" onclick="addReference()">Add speaker clip</button></details><p class="small muted" style="margin:0">Audio and transcript are sent to OpenAI for processing. Use personal or approved recordings; API monitoring may retain content temporarily.</p><button id="start" class="primary full" onclick="startUpload()">Upload and create memo</button></div></section><section class="card"><div class="row"><h2 style="margin:0">Your recordings</h2><span id="jobs-count" class="small muted">${jobs.length}</span></div><div id="jobs-list" style="margin-top:18px">${jobs.length?jobs.map(jobCard).join(''):'<p class="muted">Your completed memos will appear here.</p>'}</div></section>`}
function addReference(){const wrap=document.getElementById('references');if(wrap.children.length>=4)return error('Use up to four speaker clips.');const row=document.createElement('div');row.className='stack';row.style.margin='14px 0';row.innerHTML='<input class="ref-name" type="text" maxlength="80" placeholder="Speaker name"><input class="ref-file" type="file" accept="audio/*,.m4a,.mp3,.wav,.webm">';wrap.append(row)}
function picked(input){selected=input.files?.[0]||null;document.getElementById('file-label').textContent=selected?selected.name:'Choose audio from Files or iCloud';if(selected&&!document.getElementById('title').value)document.getElementById('title').value=selected.name.replace(/\.[^.]+$/,'')}
async function startUpload(){if(busy)return;const file=selected;if(!file)return error('Choose an audio file first.');if(file.size>1024**3)return error('The beta accepts files up to 1 GB.');const title=document.getElementById('title').value.trim()||file.name;const mode=document.querySelector('input[name=mode]:checked').value;const terms=document.getElementById('terms').value;const refs=[...document.querySelectorAll('#references .stack')].map(row=>({name:row.querySelector('.ref-name').value.trim(),file:row.querySelector('.ref-file').files[0]}));if(refs.length&&mode!=='meeting')return error('Speaker clips require Conversation or meeting mode.');if(refs.some(ref=>!ref.name||!ref.file))return error('Each speaker clip needs a name and audio file.');try{busy=true;document.getElementById('start').disabled=true;const job=await api('/jobs',{method:'POST',body:JSON.stringify({title,filename:file.name,size:file.size,mode,terms})});for(const ref of refs)await api('/jobs/'+job.id+'/speaker-reference',{method:'POST',headers:{'X-Speaker-Name':encodeURIComponent(ref.name),'X-File-Name':ref.file.name},body:ref.file});await sendFile(job.id,file)}catch(e){error(e.message)}finally{busy=false;const button=document.getElementById('start');if(button)button.disabled=false}}
async function sendFile(id,file){let job=await api('/jobs/'+id);if(file.name!==job.filename||file.size!==job.size)throw Error('Choose the same file to resume: '+job.filename);let offset=job.offset;while(offset<file.size){const part=file.slice(offset,offset+4*1024*1024);try{const answer=await api('/jobs/'+id+'/upload',{method:'PUT',headers:{'X-Upload-Offset':String(offset)},body:part});offset=answer.offset}catch(e){job=await api('/jobs/'+id);if(job.offset>offset){offset=job.offset;continue}throw e}const card=jobs.find(j=>j.id===id);if(card){card.offset=offset;if(document.getElementById('jobs-list'))renderJobs()}}await api('/jobs/'+id+'/finish',{method:'POST'});selected=null;await refresh();openJob(id)}
async function resume(id){const job=jobs.find(j=>j.id===id);if(!job)return;const picker=document.createElement('input');picker.type='file';picker.accept='.m4a,.mp3,.mp4,.mpeg,.mpga,.wav,.webm,audio/*';picker.onchange=async()=>{try{await sendFile(id,picker.files[0])}catch(e){error(e.message)}};picker.click()}
async function retry(id){try{await api('/jobs/'+id+'/retry',{method:'POST'});await refresh()}catch(e){error(e.message)}}
function download(id,name){return '/api/jobs/'+id+'/downloads/'+name}
async function openJob(id){let job=await api('/jobs/'+id);const report=job.report||{};root.innerHTML=`<div id="job-detail" data-id="${id}" data-status="${job.status}" data-part="${job.current_part||0}"><div class="row"><button class="linkbutton" onclick="renderHome()">← All recordings</button><button class="linkbutton" onclick="deleteJob('${id}')">Delete recording</button></div><h1>${escapeHtml(job.title)}</h1><p class="lead">${escapeHtml(stage(job))}${job.duration_seconds?' · '+Math.round(job.duration_seconds/60)+' min':''}</p><div id="message" hidden></div>${job.error?`<div class="notice danger">${escapeHtml(job.error)} <button class="secondary" onclick="retry('${id}')">Retry</button></div>`:''}${job.status==='ready'?`<section class="card"><h2>Your downloads</h2><div class="actions"><a href="${download(id,'transcript.txt')}">Full transcript · TXT</a><a href="${download(id,'comprehensive.docx')}">Full report · Word</a><a href="${download(id,'brief.docx')}">Brief summary · Word</a><a href="${download(id,'memo-downloads.zip')}">Download all · ZIP</a></div><p class="small muted">English and 中文 are included in both reports. The transcript preserves spoken languages.</p></section>${job.speakers?.length?`<section class="card"><h2>Review speakers</h2><p class="small muted">Labels from separate parts are kept distinct unless you confirm they are the same person. Enter the same name for matching speakers, then save to update the transcript download.</p><div id="speakers">${job.speakers.map((speaker,i)=>`<div class="speaker"><span>${escapeHtml(speaker)}</span><input data-speaker="${escapeHtml(speaker)}" value="${escapeHtml(job.speaker_names?.[speaker]||'')}" placeholder="Name or preferred label"></div>`).join('')}</div><button class="secondary" onclick="saveSpeakers('${id}')">Save speaker names</button></section>`:''}<section class="card"><h2>Brief summary</h2><h3>English</h3><div class="report">${escapeHtml(report.brief_en)}</div><h3 style="margin-top:20px">中文</h3><div class="report">${escapeHtml(report.brief_zh)}</div><details><summary>Read comprehensive report</summary><h3 style="margin-top:18px">English</h3><div class="report">${escapeHtml(report.comprehensive_en)}</div><h3 style="margin-top:18px">中文</h3><div class="report">${escapeHtml(report.comprehensive_zh)}</div></details></section>`:`<section class="card"><h2>Working on your memo</h2><p class="muted">${escapeHtml(stage(job))}. Once upload is complete, you can leave Safari and return later.</p><div class="progress"><i style="width:${job.total_parts?Math.max(3,100*(job.current_part||0)/job.total_parts):3}%"></i></div></section>`}</div>`}
async function deleteJob(id){if(!confirm('Delete this recording, transcript and reports from active storage? Host backups may retain copies temporarily.'))return;try{await api('/jobs/'+id,{method:'DELETE'});await refresh();renderHome()}catch(e){error(e.message)}}
async function saveSpeakers(id){const names={};document.querySelectorAll('[data-speaker]').forEach(input=>{if(input.value.trim())names[input.dataset.speaker]=input.value.trim()});try{const updated=await api('/jobs/'+id+'/speakers',{method:'POST',body:JSON.stringify({names})});jobs=jobs.map(j=>j.id===id?updated:j);openJob(id)}catch(e){error(e.message)}}
restore();
</script></body></html>
